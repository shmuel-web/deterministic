# ---------------------------------------------------------------------------
# Kanban board automation for the "Team 7 Kanban" board.
#
# Flow:
#   (Backlog: open issue, no status label)
#     --human moves-->            status::To Do
#     --branch or MR opened-->    status::In Progress   (board:in_progress)
#     --MR merged-->              Closed = Done          (board:done)
#
# Requires CI/CD variable BOARD_BOT_TOKEN:
#   a Project Access Token with `api` scope, Masked, NOT Protected.
# ---------------------------------------------------------------------------

# Avoid duplicate pipelines: run an MR pipeline once an MR exists, otherwise a
# branch pipeline. Never run both for the same branch at the same time.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - deterministic
  - board

# --- Quality gate: typecheck + tests (with coverage) -------------------------
# Makes "pipeline must succeed" a real merge gate, and satisfies our own repo
# rules (ci-runs-tests + has-coverage-tool).
test:
  stage: test
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - npm ci
    - npm run lint
    - npm run typecheck
    - npx c8 --reporter=text --reporter=lcov --reporter=json-summary npm test

# --- Deterministic: score the repo on every MR and branch push ---------------
deterministic:
  stage: deterministic
  image: node:22
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - npm ci
    - npm run score:repo || true

# --- In Progress: a branch was pushed or an MR was opened for an issue -------
board:in_progress:
  stage: board
  image: curlimages/curl:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
  script:
    - |
      set -eu
      AUTH="PRIVATE-TOKEN: ${BOARD_BOT_TOKEN}"
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"

      if [ "${CI_PIPELINE_SOURCE}" = "merge_request_event" ]; then
        # Issues this MR will close (GitLab parses "Closes #N" from the description)...
        ISSUES=$(curl -sf --header "$AUTH" "$API/merge_requests/${CI_MERGE_REQUEST_IID}/closes_issues" \
                 | grep -oE '"iid":[0-9]+' | grep -oE '[0-9]+' || true)
        # ...falling back to a leading number on the source branch (e.g. 42-fix-thing).
        if [ -z "$ISSUES" ]; then
          ISSUES=$(printf '%s' "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}" | grep -oE '^[0-9]+' || true)
        fi
      else
        # Feature-branch push: take the leading issue number from the branch name.
        ISSUES=$(printf '%s' "${CI_COMMIT_BRANCH}" | grep -oE '^[0-9]+' || true)
      fi

      if [ -z "$ISSUES" ]; then
        echo "No linked issue detected; nothing to move."
        exit 0
      fi

      for IID in $ISSUES; do
        echo "Issue #$IID -> status::In Progress"
        # Scoped labels are mutually exclusive, so adding In Progress drops To Do;
        # remove_labels is belt-and-suspenders. add_labels preserves other labels.
        curl -sf --request PUT --header "$AUTH" \
          --data-urlencode "add_labels=status::In Progress" \
          --data-urlencode "remove_labels=status::To Do" \
          "$API/issues/${IID}" -o /dev/null -w "  HTTP %{http_code}\n"
      done

# --- Done: an MR was merged into the default branch --------------------------
board:done:
  stage: board
  image: curlimages/curl:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      set -eu
      AUTH="PRIVATE-TOKEN: ${BOARD_BOT_TOKEN}"
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"

      # MRs associated with the commit that just landed on the default branch.
      MRS=$(curl -sf --header "$AUTH" "$API/repository/commits/${CI_COMMIT_SHA}/merge_requests" \
            | grep -oE '"iid":[0-9]+' | grep -oE '[0-9]+' || true)

      if [ -z "$MRS" ]; then
        echo "No merge request found for this commit; nothing to close."
        exit 0
      fi

      for MR in $MRS; do
        ISSUES=$(curl -sf --header "$AUTH" "$API/merge_requests/${MR}/closes_issues" \
                 | grep -oE '"iid":[0-9]+' | grep -oE '[0-9]+' || true)
        for IID in $ISSUES; do
          echo "MR !$MR merged -> closing issue #$IID (Done)"
          curl -sf --request PUT --header "$AUTH" \
            --data-urlencode "state_event=close" \
            --data-urlencode "remove_labels=status::In Progress" \
            "$API/issues/${IID}" -o /dev/null -w "  HTTP %{http_code}\n"
        done
      done
